<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { height: 100%; margin: 0; font-family: sans-serif; }
        .bg {
            background-image: url('your-photo.jpg'); /* Replace with your image */
            height: 100%; background-position: center;
            background-repeat: no-repeat; background-size: cover;
            display: flex; align-items: center; justify-content: center;
        }
        .box {
            background: rgba(255, 255, 255, 0.8); /* Semi-transparent white */
            padding: 20px; border-radius: 8px;
            max-width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="box">
            <h1>Welcome</h1>
            <p>This is your responsive text box. It works great on mobile!</p>
        </div>
    </div>
</body>
</html>
