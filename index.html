<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2AC2BD" />
<style>
        body, html { height: 100%; margin: 0; font-family: sans-serif; }
        .bg {
            background-image: url('your-photo.png'); /* Replace with your image */
            height: 100%; background-position: center top;
            background-repeat: no-repeat; background-size: cover;
            display: flex; align-items: center; justify-content: center;
        }
    
        .box {
            background: rgba(255, 255, 255, 0.8); /* Semi-transparent white */
            padding: 12px; border-radius: 18px;
            max-width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .ig-tile {
            width: 200px;
            height: 200px;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 18px rgba(0,0,0,0.15);
            transition: transform 0.2s ease;
            background: #eee;
        }
         
        .ig-tile:hover {
            transform: translateY(-4px);
        }
         
        .ig-tile a {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            text-decoration: none;
            color: white;
        }
         
        .ig-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
         
        .ig-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(0,0,0,0.75),
                rgba(0,0,0,0.15)
            );
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 18px;
            box-sizing: border-box;
        }
         
        .ig-logo {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="box">
            <h1>JUST RIDE</h1>
            <div class="ig-tile">
                <a href="https://www.instagram.com/zvyk.eu?igsh=MTJrZGJhNzk4dDlsbQ==" target="_blank" rel="noopener noreferrer">
                    <img src="ig-intro.jpg" alt="Instagram příspěvek">
                    <div class="ig-overlay">
                        <div class="ig-logo">📷 zvyk.eu</div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
